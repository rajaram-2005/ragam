name: Desktop packages

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  # Platform packaging must finish rather than be silently cancelled by a newer
  # push. A cancelled macOS job cannot be used as release evidence.
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # Electron's GitHub release host intermittently returns 504 while
    # electron-builder fetches Electron and its platform toolsets. These are the
    # officially documented mirror variables; checksums are still enforced.
    # The unpacked-build retry below remains a second, independent safeguard.
    env:
      ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'
      ELECTRON_BUILDER_BINARIES_MIRROR: 'https://npmmirror.com/mirrors/electron-builder-binaries/'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 and ARM64
            runner: ubuntu-24.04
            target: --linux AppImage deb --x64 --arm64
            artifact: linux-x64-arm64
          - name: Windows x64 and ARM64
            runner: windows-latest
            target: --win nsis --x64 --arm64
            artifact: windows-x64-arm64
          # The retired macOS 14 label schedules no runner. Split Intel and Apple
          # Silicon onto their own supported standard runners: a single arm64 job
          # building both architectures spent 15 minutes unassigned on main.
          - name: macOS Intel (x64)
            runner: macos-15-intel
            target: --mac dmg --x64
            artifact: macos-intel-x64
          - name: macOS Apple Silicon (arm64)
            runner: macos-26
            target: --mac dmg --arm64
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - name: Install locked web and desktop build dependencies
        run: |
          npm ci --prefix apps/web
          npm ci --prefix apps/desktop

      - name: Verify the cross-platform CPU model runtime
        run: node --test services/core/test/klyvaron-runtime.test.mjs

      - name: Test the desktop loopback server
        run: npm test
        working-directory: apps/desktop

      # electron-builder fetches Electron and platform helper binaries from an
      # external release host. A transient 504/500 there must not fail an
      # unrelated source change. Three attempts with backoff still fail a real
      # packaging error, and the downloaded artifacts are not cached as a pass.
      - name: Build the React app and unpacked desktop app
        shell: bash
        run: |
          npm run build:web
          for attempt in 1 2 3; do
            echo "electron-builder unpacked-app attempt ${attempt} of 3"
            if npx electron-builder --dir; then
              exit 0
            fi
            rm -rf release
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          exit 1
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Install virtual display for Linux desktop smoke test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
          command -v xvfb-run

      - name: Smoke-test the packaged desktop app and loopback Core
        run: npm run smoke
        working-directory: apps/desktop

      - name: Build native installer packages
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Pass matrix data through the environment; the checked-in Node runner
          # validates it against a fixed allow-list before spawning electron-builder.
          RAGAM_ELECTRON_BUILDER_TARGET: ${{ matrix.target }}
        run: node ../../scripts/release/build-desktop-target.mjs

      - name: Upload unsigned desktop package
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: ragam-${{ matrix.artifact }}
          path: apps/desktop/release/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      # The artifact service can fail with a transient DNS error while uploading
      # an otherwise valid installer. Retry once; the retry has no
      # continue-on-error, so a persistent failure still fails the platform job.
      - name: Retry artifact upload after transient storage failure
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ragam-${{ matrix.artifact }}
          path: apps/desktop/release/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true
