name: Desktop packages

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 and ARM64
            runner: ubuntu-24.04
            target: --linux AppImage deb --x64 --arm64
          - name: Windows x64 and ARM64
            runner: windows-latest
            target: --win nsis --x64 --arm64
          - name: macOS Intel and Apple Silicon
            runner: macos-14
            target: --mac dmg --x64 --arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - name: Install locked web and desktop build dependencies
        run: |
          npm ci --prefix apps/web
          npm ci --prefix apps/desktop

      - name: Verify the cross-platform CPU model runtime
        run: node --test services/core/test/klyvaron-runtime.test.mjs

      - name: Test the desktop loopback server
        run: npm test
        working-directory: apps/desktop

      - name: Build the React app and unpacked desktop app
        run: |
          npm run build:web
          npx electron-builder --dir
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Install virtual display for Linux desktop smoke test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
          command -v xvfb-run

      - name: Smoke-test the packaged desktop app and loopback Core
        run: npm run smoke
        working-directory: apps/desktop

      - name: Build native installer packages for both CPU architectures
        if: runner.os != 'Linux'
        run: npx electron-builder ${{ matrix.target }}
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build Linux installer packages with failure details
        if: runner.os == 'Linux'
        shell: bash
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          log_file="$RUNNER_TEMP/linux-installer-build.log"
          set +e
          npx electron-builder ${{ matrix.target }} >"$log_file" 2>&1
          status=$?
          cat "$log_file"
          if [ "$status" -ne 0 ]; then
            details=$(tail -n 25 "$log_file" | tr '\n' ' ' | cut -c 1-2400)
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            printf '::error title=Linux installer build details::%s\n' "$details"
          fi
          exit "$status"

      - name: Upload unsigned desktop package
        uses: actions/upload-artifact@v4
        with:
          name: ragam-${{ matrix.name }}
          path: apps/desktop/release/*
          if-no-files-found: error
          retention-days: 14
