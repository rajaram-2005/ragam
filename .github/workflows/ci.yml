name: CI

# The three independent components keep separate dependency/test jobs. The self-host
# integration job builds and exercises the Docker Compose stack; release and docs jobs
# verify their own cross-component contracts. No job adds runtime dependencies to Core.
#
# Nothing here installs torch. services/fabric is NumPy-only by design, and on a
# GPU-less runner pip resolves torch to the CUDA build and downloads gigabytes that
# cannot be used. See docs/04-setup.md.

on:
  push:
    branches: [main, 'arena/**']
    tags: ['klyvaron-lite-v*', 'klyvaron-pro-v*', 'klyvaron-max-v*']
  pull_request:
    branches: [main]
  schedule:
    # Advisories are published continuously, and a commit that was clean when it merged
    # can become vulnerable afterwards. Without this the audit gates only re-run when
    # something else changes, so a newly published advisory against already-merged
    # code would wait for the next unrelated build. Weekly, at an off-peak
    # non-round minute: GitHub documents that top-of-hour cron jobs are heavily
    # contended and may be delayed or dropped.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Keep an in-flight CPU-heavy acceptance run alive when a newer commit arrives.
  # New commits may replace the pending run, but they must not cancel a Max inference test.
  cancel-in-progress: false

jobs:
  core:
    name: Core service (Node, zero dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # node:sqlite requires Node >= 22.5.0; it is what the knowledge store and the
      # audit ledger use, so an older runtime fails immediately rather than subtly.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Provision legacy Pro/Max artifacts for acceptance tests only
        # These artifacts are isolated test inputs, never app startup or desktop dependencies.
        run: |
          python -m pip install --upgrade pip && pip install -r services/fabric/requirements.lock
          mkdir -p .aetheris-data/online/klyvaron/models
          curl -fsSL https://codeload.github.com/rajaram-2005/ragam/tar.gz/c9f6aa2f5e31ed462caae1f94395ba46ea808a40 \
            | tar -xz --strip-components=1 -C .aetheris-data/online/klyvaron/models
          (
            cd .aetheris-data/online/klyvaron/models
            cat klyvaron-max-lm/klyvaron-max-lm-0.1.0.npz.part* > klyvaron-max-lm/klyvaron-max-lm-0.1.0.npz
            rm -f klyvaron-max-lm/klyvaron-max-lm-0.1.0.npz.part*
            sha256sum -c SHA256SUMS
            rm -f SHA256SUMS
          )

      - name: Verify the zero-dependency property
        run: |
          # This is a load-bearing property, not a stylistic one: it is what keeps the
          # core service auditable and lets it run without a supply chain.
          node -e '
            const pkg = require("./services/core/package.json");
            const deps = {...(pkg.dependencies||{}), ...(pkg.devDependencies||{})};
            const names = Object.keys(deps);
            if (names.length) {
              console.error("services/core must have no dependencies, found:", names.join(", "));
              process.exit(1);
            }
            console.log("services/core declares zero dependencies");
          '
          if [ -d services/core/node_modules ]; then
            echo "::error::services/core/node_modules exists; the core service must not have an install step"
            exit 1
          fi

      # No count in the step name: a number in a string is a number that drifts, and this
      # one already had. docs/03-status.md reports the current totals.
      - name: Test
        working-directory: services/core
        run: |
          # Match the release-verification invocation and retain the TAP diagnostics.
          # A separate Core job must expose its failure reason in check annotations too.
          set +e
          # Max acceptance exercises a 92M-parameter CPU runtime. Run one test file at a time
          # so unrelated suites cannot compete for the worker-thread and memory budget.
          node --test --test-concurrency=1 --test-reporter=tap test/*.test.mjs test/klyvaron-release/*.test.mjs > /tmp/core.tap 2>&1
          status=$?
          tail -n 10 /tmp/core.tap
          if [ "$status" -ne 0 ]; then
            grep -E '^not ok ' /tmp/core.tap | head -n 5 |
              while IFS= read -r line; do echo "::error::$line"; done
            awk '/^not ok /{remaining=25} remaining>0{print; remaining--}' /tmp/core.tap | head -n 100 |
              while IFS= read -r line; do echo "::error::$(printf '%s' "$line" | cut -c1-300)"; done
          fi
          exit "$status"

  fabric:
    name: Fabric training service (Python + NumPy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned NumPy, multimodal packages, and pytest (never torch)
        run: python -m pip install --upgrade pip && pip install -r services/fabric/requirements.lock

      - name: Confirm no GPU is assumed
        run: |
          # The whole pipeline must run on CPU. If anything ever starts importing a
          # GPU-only dependency, this fails here rather than on a runner that has one.
          python -c "import numpy; print('numpy', numpy.__version__)"
          if python -c "import torch" 2>/dev/null; then
            echo "::error::torch is importable; services/fabric must not depend on it"
            exit 1
          fi
          echo "no torch present, as intended"

      - name: Audit Python dependencies for known advisories
        working-directory: services/fabric
        env:
          # The advisory API is public, but a runner's shared egress IP can hit the
          # unauthenticated rate limit. The token Actions already provides lifts it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # npm audit covers the web tree; pip has no equivalent, so this queries the
          # GitHub Advisory Database directly. Standard library plus `packaging`,
          # which pytest already depends on — no dependency added for the check.
          #
          # Exit codes are deliberate: 0 clean, 1 a known-vulnerable version is
          # installed, 2 the database could not be consulted. Exit 2 fails the build
          # on purpose, because a dependency gate that cannot reach the database has
          # verified nothing and must not report green.
          #
          # Verified in both directions before being added: against numpy 2.1.3 and
          # pytest 9.1.1 it exits 0, and against pytest==8.3.4 it exits 1 naming
          # GHSA-6w46-j5rx-g56g / CVE-2025-71176. The unreachable-database,
          # malformed-argument and no-target paths were each confirmed to exit 2.
          python scripts/audit_python_deps.py

      - name: Test
        working-directory: services/fabric
        run: |
          # pytest's own output is the only description of what failed, and a job log is
          # behind a sign-in wall for anyone reading the checks from outside the browser
          # session that owns the repository. On failure the failing tests and the first
          # assertion are emitted as annotations, which the checks API serves openly --
          # without this, a red Fabric check is a red check with no stated reason.
          set +e
          python -m pytest -rf > /tmp/fabric-pytest.log 2>&1
          status=$?
          cat /tmp/fabric-pytest.log
          if [ "$status" -ne 0 ]; then
            grep -E '^(FAILED|ERROR) ' /tmp/fabric-pytest.log | head -n 5 |
              while IFS= read -r line; do echo "::error::$line"; done
            awk '/^=+ FAILURES =+$/{seen=1} seen' /tmp/fabric-pytest.log | head -n 25 |
              while IFS= read -r line; do echo "::error::$(printf '%s' "$line" | cut -c1-300)"; done
          fi
          exit "$status"

      - name: Reproduce the released model card
        working-directory: services/fabric
        run: |
          # The release gate is the point of the pipeline: an undertrained model must
          # fail to release rather than quietly become the current one.
          python - <<'PY'
          from fabric.pipeline import Pipeline, PipelineConfig

          p = Pipeline(PipelineConfig(epochs=25))
          record = p.run()
          card = p.registry.current()
          print("run status:", record.status)
          print("released:  ", card.identifier)
          print("mrr:       ", card.metrics["mrr"])

          assert record.status == "partial", (
              f"3 of 8 stages cannot run without weights or a GPU; expected 'partial', "
              f"got '{record.status}'. A 'completed' status here would mean the pipeline "
              "started claiming work it did not do."
          )
          assert card is not None, "the low-overlap run must release a model"
          assert card.base_checkpoint is None, "trained from scratch; not a fine-tune"
          assert card.metrics["mrr"] >= 0.60, "below the release floor"

          # And the negative control: the same pipeline must refuse to release junk.
          weak = Pipeline(PipelineConfig(epochs=3, evaluate_topic_split=False))
          weak_record = weak.run()
          assert weak_record.status == "failed", (
              f"an undertrained run must fail, got '{weak_record.status}'"
          )
          assert weak.registry.current() is None, (
              "an undertrained run must not become the current released model"
          )
          print("undertrained run correctly refused release")
          PY

  web:
    name: Web app (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        working-directory: apps/web
        run: npm ci

      - name: Check self-hosted entrypoints
        run: |
          node --check scripts/self-host-smoke.mjs
          node --check services/core/src/server.mjs

      - name: Test
        working-directory: apps/web
        run: node --test test/*.test.mjs

      - name: Audit dependencies for known vulnerabilities
        working-directory: apps/web
        run: |
          # Two different policies, because two different things are at stake.
          #
          # Production dependencies are what actually ships to a user's browser, so
          # ANY known vulnerability there is a release blocker at any severity.
          echo "== production dependencies (must be clean at every severity) =="
          npm audit --omit=dev --audit-level=low
          #
          # The full tree includes build tooling whose advisories are mostly about
          # the dev server. Those are worth failing on when severe, but a moderate
          # dev-server issue should not block a merge, so the bar is high/critical.
          # The full report is printed either way, so moderate findings stay visible
          # in the log instead of being silently tolerated.
          echo "== full tree (fails on high/critical; full report printed) =="
          npm audit || true
          npm audit --audit-level=high
          #
          # Both commands were verified against a known-vulnerable tree before being
          # committed here: at vite@5.4.11 the second exits 1 (thirteen Vite
          # advisories plus GHSA-67mh-4wv8-2f99 in esbuild) and at vite@8.3.4 both
          # exit 0. An audit step that cannot fail is worse than no audit step.

      - name: Build
        working-directory: apps/web
        run: npm run build

      - name: Verify the bundle carries no backend URL or credential
        working-directory: apps/web
        run: |
          # Browser-facing code must use relative /api paths only, so the same build
          # works against any origin that proxies /api. A baked-in host or a leaked
          # secret in the artifact is a release blocker, not a warning.
          bundle=$(ls dist/assets/*.js)
          echo "checking $bundle"
          if grep -Eq 'https?://(127\.0\.0\.1|localhost)' "$bundle"; then
            echo "::error::bundle contains an absolute loopback backend URL"
            exit 1
          fi
          if grep -Eiq '(api[_-]?key|secret|token|password)"?\s*[:=]\s*"?[A-Za-z0-9_-]{16,}' "$bundle"; then
            echo "::error::bundle appears to contain a credential"
            exit 1
          fi
          echo "bundle is clean"

  self-hosted:
    name: Docker Compose build, health, persistence and restore smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse the Windows backup and restore launchers
        shell: pwsh
        run: |
          $paths = @('scripts/Ragam-Volume.ps1', 'scripts/Backup-Ragam.ps1', 'scripts/Restore-Ragam.ps1')
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
              exit 1
            }
          }
          Write-Output 'All Windows backup and restore scripts parse successfully.'

      - name: Validate Compose configuration and build images
        run: |
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml build

      - name: Start the self-hosted stack
        run: |
          set +e
          output=$(docker compose -f compose.yaml up -d 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            echo "::error title=Compose startup failed::docker compose up exited with status $status"
            docker compose -f compose.yaml ps -a | while IFS= read -r line; do echo "::error::$line"; done
            docker compose -f compose.yaml logs --no-color 2>&1 | tail -n 120 | while IFS= read -r line; do echo "::error::$(printf '%s' "$line" | cut -c1-300)"; done
            exit "$status"
          fi

      - name: Verify the local single-user API through Caddy
        env:
          RAGAM_SMOKE_URL: http://localhost
          RAGAM_SMOKE_ID_FILE: ${{ runner.temp }}/ragam-local-id
          RAGAM_SMOKE_MODE: bootstrap
        run: node scripts/self-host-smoke.mjs

      - name: Cold-backup the named volume, restore it, and verify persistence
        env:
          RAGAM_SMOKE_ID_FILE: ${{ runner.temp }}/ragam-local-id
        run: |
          docker compose -f compose.yaml stop core
          mkdir -p "$RUNNER_TEMP/ragam-backup"
          docker run --rm -v ragam-data:/source:ro -v "$RUNNER_TEMP/ragam-backup:/backup" busybox:1.36 tar -czf /backup/ragam-data.tar.gz -C /source .
          docker run --rm -v ragam-data:/target busybox:1.36 sh -c 'find /target -mindepth 1 -maxdepth 1 -exec rm -rf {} +'
          docker run --rm -v ragam-data:/target -v "$RUNNER_TEMP/ragam-backup:/backup:ro" busybox:1.36 sh -c 'tar -xzf /backup/ragam-data.tar.gz -C /target && chown -R 1000:1000 /target'
          docker compose -f compose.yaml start core
          RAGAM_SMOKE_URL=http://localhost RAGAM_SMOKE_MODE=verify node scripts/self-host-smoke.mjs

      - name: Show diagnostics and remove test stack
        if: always()
        run: |
          docker compose -f compose.yaml ps || true
          docker compose -f compose.yaml logs --no-color || true
          docker compose -f compose.yaml down --volumes --remove-orphans || true

  klyvaron-production-release-gate:
    name: Klyvaron production evidence gate (fail closed)
    if: startsWith(github.ref, 'refs/tags/klyvaron-')
    runs-on: ubuntu-latest
    env:
      # Public trust anchors and model weights are provisioned by the protected release
      # environment; neither is silently fetched or replaced by this workflow.
      KLYVARON_ARTIFACT_ROOT: ${{ vars.KLYVARON_ARTIFACT_ROOT }}
      KLYVARON_TRUST_STORE: ${{ vars.KLYVARON_TRUST_STORE_PATH }}
      KLYVARON_REGISTRY_RECORD: ${{ vars.KLYVARON_REGISTRY_RECORD_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the exact tier package, signatures and real artifact bytes
        run: |
          case "$GITHUB_REF_NAME" in
            klyvaron-lite-v*) tier=lite; version="${GITHUB_REF_NAME#klyvaron-lite-v}" ;;
            klyvaron-pro-v*) tier=pro; version="${GITHUB_REF_NAME#klyvaron-pro-v}" ;;
            klyvaron-max-v*) tier=max; version="${GITHUB_REF_NAME#klyvaron-max-v}" ;;
            *) echo "::error::unsupported Klyvaron production tag"; exit 2 ;;
          esac
          test -n "$KLYVARON_ARTIFACT_ROOT" || { echo "::error::production artifact root is not provisioned"; exit 2; }
          test -n "$KLYVARON_TRUST_STORE" || { echo "::error::production public trust store is not provisioned"; exit 2; }
          test -n "$KLYVARON_REGISTRY_RECORD" || { echo "::error::production-approved registry record is not provisioned"; exit 2; }
          node services/core/scripts/verify-klyvaron-release.mjs \
            --tag "$GITHUB_REF_NAME" \
            --package-dir "release-evidence/$tier/v$version" \
            --artifact-root "$KLYVARON_ARTIFACT_ROOT/$tier/v$version" \
            --trust-store "$KLYVARON_TRUST_STORE" \
            --registry-record "$KLYVARON_REGISTRY_RECORD"

  release:
    name: Release verification (measured, not remembered)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enforce the no-direct-release registry policy
        run: node services/core/scripts/verify-klyvaron-release.mjs --policy-check

      - name: Provision legacy Pro/Max artifacts for acceptance tests only
        # These artifacts are isolated test inputs, never app startup or desktop dependencies.
        run: |
          python -m pip install --upgrade pip > /dev/null && pip install -r services/fabric/requirements.lock
          mkdir -p .aetheris-data/online/klyvaron/models
          curl -fsSL https://codeload.github.com/rajaram-2005/ragam/tar.gz/c9f6aa2f5e31ed462caae1f94395ba46ea808a40 \
            | tar -xz --strip-components=1 -C .aetheris-data/online/klyvaron/models
          (
            cd .aetheris-data/online/klyvaron/models
            cat klyvaron-max-lm/klyvaron-max-lm-0.1.0.npz.part* > klyvaron-max-lm/klyvaron-max-lm-0.1.0.npz
            rm -f klyvaron-max-lm/klyvaron-max-lm-0.1.0.npz.part*
            sha256sum -c SHA256SUMS
            rm -f SHA256SUMS
          )

      # The release check compares the totals the documentation states with the totals the
      # suites produced, so the suites have to run here. Reading the numbers out of docs/03 and
      # then checking docs/03 against them would verify nothing.
      - name: Core suite, counted
        working-directory: services/core
        run: |
          set +e
          # Max acceptance exercises a 92M-parameter CPU runtime. Run one test file at a time
          # so unrelated suites cannot compete for the worker-thread and memory budget.
          node --test --test-concurrency=1 --test-reporter=tap test/*.test.mjs test/klyvaron-release/*.test.mjs > /tmp/core.tap 2>&1
          status=$?
          tail -n 10 /tmp/core.tap
          if [ "$status" -ne 0 ]; then
            grep -E '^not ok ' /tmp/core.tap | head -n 5 |
              while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi
          core=$(awk '/^# tests /{print $3}' /tmp/core.tap | tail -n 1)
          echo "CORE_TESTS=$core" >> "$GITHUB_ENV"
          echo "core tests: $core"

      - name: Web suite, counted
        working-directory: apps/web
        run: |
          npm ci
          set +e
          node --test --test-reporter=tap test/*.test.mjs > /tmp/web.tap 2>&1
          status=$?
          tail -n 10 /tmp/web.tap
          if [ "$status" -ne 0 ]; then
            grep -E '^not ok ' /tmp/web.tap | head -n 5 |
              while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi
          web=$(awk '/^# tests /{print $3}' /tmp/web.tap | tail -n 1)
          echo "WEB_TESTS=$web" >> "$GITHUB_ENV"
          echo "web tests: $web"

      - name: Fabric suite, counted
        working-directory: services/fabric
        run: |
          set +e
          # Not `-q`: in pytest 9 the summary line ("814 passed") is suppressed when
          # stdout is a file, and the summary is exactly what this step counts.
          python -m pytest > /tmp/fabric.log 2>&1
          status=$?
          tail -n 5 /tmp/fabric.log
          if [ "$status" -ne 0 ]; then
            grep -E '^(FAILED|ERROR) ' /tmp/fabric.log | head -n 5 |
              while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi
          fabric=$(grep -oE '[0-9]+ passed' /tmp/fabric.log | tail -n 1 | awk '{print $1}')
          echo "FABRIC_TESTS=$fabric" >> "$GITHUB_ENV"
          echo "fabric tests: $fabric"

      - name: Verify the release
        run: |
          node services/core/scripts/release-check.mjs \
            --core "$CORE_TESTS" --web "$WEB_TESTS" --fabric "$FABRIC_TESTS"

      - name: Benchmark the adaptive core
        run: |
          # The benchmark is checked for *shape*, not for matching the committed artefact:
          # rates belong to the runner. What must hold is that no benchmark failed and every
          # one produced a measurement.
          node services/core/scripts/benchmark-adaptive.mjs

  docs:
    name: Documentation matches implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # docs.test.mjs asserts the model card records a real git SHA and that it
          # was re-verified at a *different* revision, so history must be present.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Docs accuracy suite
        working-directory: services/core
        run: node --test test/docs.test.mjs

      - name: Confirm the licence copies are byte-identical
        run: |
          # Hand-transcribed licences are how attribution silently breaks. The texts
          # in third-party/licenses/ are the authoritative copies; this checks they
          # are non-trivial and that NOTICES quotes them exactly.
          for f in third-party/licenses/*.txt; do
            size=$(wc -c < "$f")
            echo "$f: $size bytes"
            if [ "$size" -lt 100 ]; then
              echo "::error::$f looks truncated ($size bytes)"
              exit 1
            fi
          done
          test -f third-party/licenses/aetheris-MIT.txt
          test -f third-party/licenses/sparsiz-Unlicense.txt
          test -f third-party/licenses/numpy-BSD-3-Clause.txt
          # NumPy's licence bundles component licences and must not be truncated.
          numpy_size=$(wc -c < third-party/licenses/numpy-BSD-3-Clause.txt)
          if [ "$numpy_size" -lt 40000 ]; then
            echo "::error::NumPy licence truncated to $numpy_size bytes; the bundled component licences must be preserved"
            exit 1
          fi
          echo "all licence copies present and untruncated"
