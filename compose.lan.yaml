# Opt-in LAN-only overlay. scripts/Start-Lan-Ragam.ps1 generates the ignored
# deploy/Caddyfile.lan.local after collecting a private bind address, a LAN hostname,
# and a password. This tracked overlay never publishes a host port: only the launcher
# adds a temporary, external Compose override after validating the private IPv4.
# The default compose.yaml remains loopback-only.
services:
  core:
    environment:
      # Caddy passes Host=localhost so local-single-user mode stays closed to direct
      # network access; Core separately allow-lists the browser's exact HTTPS origin.
      AETHERIS_TRUSTED_WEB_ORIGINS: "https://${RAGAM_LAN_HOSTNAME:?Run scripts/Start-Lan-Ragam.ps1 first}"

  caddy:
    volumes:
      - ./deploy/Caddyfile.lan.local:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
