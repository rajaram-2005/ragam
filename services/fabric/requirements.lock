# Pinned Python runtime for services/fabric and the Core worker tests.
#
# Release builds must be reproducible: `pip install numpy jax av Pillow pytest`
# resolves whatever the index serves on the day, which is not a release input.
# This lock is the exact resolved set from `pip freeze` after installing the five
# direct dependencies on CPython 3.11 (linux x86_64). It deliberately excludes
# torch: the Fabric service is pure NumPy/JAX on CPU and installing torch on a
# GPU-less host pulls an unnecessary CUDA stack.
#
# Regenerate with:
#   python3 -m venv .venv
#   .venv/bin/pip install numpy jax av Pillow pytest
#   .venv/bin/pip freeze > services/fabric/requirements.lock
#
# CI installs with: pip install -r requirements.lock (no --upgrade, no resolver drift).

