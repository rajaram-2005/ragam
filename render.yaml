# Use Docker instead of Render's native Node runtime so the root-owned disk can
# be handed to the unprivileged app user before Core starts.
services:
  - type: web
    name: ragam-core-docker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    autoDeploy: false
    numInstances: 1
    healthCheckPath: /api/health
    disk:
      name: ragam-core-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: AETHERIS_CORE_HOST
        value: 0.0.0.0
      - key: AETHERIS_ONLINE_DATA_DIR
        value: /var/data/online
      - key: AETHERIS_COOKIE_SECURE
        value: "true"
      - key: AETHERIS_COOKIE_SAMESITE
        value: strict
      - key: AETHERIS_ONLINE_TIMEOUT_MS
        value: "55000"
      - key: AETHERIS_TRUSTED_WEB_ORIGINS
        sync: false
